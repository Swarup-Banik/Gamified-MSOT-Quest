version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: msot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: msot_admin
      POSTGRES_PASSWORD: msot_secret_2026
      POSTGRES_DB: msot_quest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msot_admin -d msot_quest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: msot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: msot_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://msot_admin:msot_secret_2026@postgres:5432/msot_quest?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secure-msot-quest-jwt-secret-key-2026!
      DAILY_XP_SOFT_CAP: 150
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@msot.edu.in
      ALLOWED_EMAIL_DOMAINS: msot.edu.in
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: msot_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: msot_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/api
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
